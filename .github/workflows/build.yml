
name: Build Fabric mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build remapped Fabric JAR
        run: gradle --no-daemon clean remapJar

      - name: Verify JAR
        run: |
          echo "Generated JAR files:"
          find build/libs -name "*.jar" -type f
          JAR=$(find build/libs -maxdepth 1 -name "*.jar" ! -name "*sources*" ! -name "*dev*" | head -n 1)
          test -n "$JAR"
          jar tf "$JAR" | grep -q "fabric.mod.json"
          jar tf "$JAR" | grep -q "\.class"
          echo "Valid Fabric JAR: $JAR"

      - uses: actions/upload-artifact@v4
        with:
          name: REDCORE-FABRIC-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error
